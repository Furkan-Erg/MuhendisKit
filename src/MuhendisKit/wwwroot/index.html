<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MühendisKit</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar no-print">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--accent)"/>
        <path d="M8 8v16h16z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M12 24v-2.5M16 24v-2.5M20 24v-2.5" stroke="#fff" stroke-width="1.4"/>
      </svg>
      <div>
        <div class="brand-name">MühendisKit</div>
        <div class="brand-sub">Makine mühendisi araçları</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="version" id="version"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar no-print">
      <button class="project-pill" id="project-pill" title="Proje"></button>
      <span class="save-state" id="save-state"></span>
      <div class="topbar-spacer"></div>
      <button class="search-btn" id="search-btn" title="Komut ara (Ctrl+K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Ara veya komut yaz…</span>
        <kbd>Ctrl K</kbd>
      </button>
    </header>
    <main class="pages" id="pages"></main>
  </div>

  <div id="print-root"></div>
  <div class="toasts" id="toasts"></div>
  <div class="overlay" id="overlay" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/insulation.js"></script>
  <script src="js/hakedis.js"></script>
  <script src="js/cad.js"></script>
  <script src="js/model3d.js"></script>
  <script src="js/settings.js"></script>
  <script>App.start()</script>
</body>
</html>
